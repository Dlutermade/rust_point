[package]
name = "storefront-center"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
anyhow = "1"
uuid = { version = "1.24", features = ["v7", "serde"] }
async-trait = "0.1"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
